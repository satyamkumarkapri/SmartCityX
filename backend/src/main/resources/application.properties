# ─────────────────────────────────────────────
# SmartCityX – Application Configuration
# ─────────────────────────────────────────────

spring.application.name=SmartCityX

# ── DataSource ────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-still-forest-atigo975-pooler.c-9.us-east-1.aws.neon.tech/SmartCityX?sslmode=require&channel_binding=require}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_Xzm8YwTaoGu7}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ───────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Thymeleaf ─────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.suffix=.html

# ── Server ────────────────────────────────────
server.port=${PORT:8080}
server.error.whitelabel.enabled=false

# ── Logging ───────────────────────────────────
logging.level.com.smartcityx=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
