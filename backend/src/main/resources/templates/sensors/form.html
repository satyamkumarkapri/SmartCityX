<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Add Sensor | SmartCityX', 'Add sensor observation')}"></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{layout/base :: sidebar('sensors')}"></div>
  <main class="main-content">
    <div th:replace="~{layout/base :: header('Add Sensor Observation', 'Record new IoT sensor reading')}"></div>
    <div class="page-content" style="max-width:600px;">
      <div class="card-glass">
        <div class="section-header mb-4">
          <div class="section-title"><i class="bi bi-wifi"></i> New Sensor Reading</div>
          <a href="/sensors" class="btn-ghost"><i class="bi bi-arrow-left"></i> Back</a>
        </div>
        <form action="/sensors" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label-smart">Sensor ID *</label>
              <input type="text" name="sensorId" class="form-control-smart" placeholder="e.g. TRF-001" required/>
            </div>
            <div class="col-md-6">
              <label class="form-label-smart">Sensor Type *</label>
              <select name="sensorType" class="form-control-smart" required>
                <option th:each="t : ${sensorTypes}" th:value="${t}" th:text="${t}"></option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label-smart">Zone *</label>
              <input type="text" name="zone" class="form-control-smart" placeholder="e.g. Zone A" required/>
            </div>
            <div class="col-md-3">
              <label class="form-label-smart">Value *</label>
              <input type="number" step="0.01" name="value" class="form-control-smart" placeholder="0.0" required/>
            </div>
            <div class="col-md-3">
              <label class="form-label-smart">Unit</label>
              <input type="text" name="unit" class="form-control-smart" placeholder="kW, AQI…"/>
            </div>
            <div class="col-12 mt-2" style="display:flex;gap:12px;">
              <button type="submit" class="btn-primary-smart"><i class="bi bi-save"></i> Save Observation</button>
              <a href="/sensors" class="btn-ghost">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
