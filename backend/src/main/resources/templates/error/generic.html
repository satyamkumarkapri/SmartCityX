<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Error | SmartCityX', 'Error page')}"></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{layout/base :: sidebar('')}"></div>
  <main class="main-content">
    <div th:replace="~{layout/base :: header('Error', 'Something went wrong')}"></div>
    <div class="page-content" style="display:flex;align-items:center;justify-content:center;min-height:60vh;">
      <div style="text-align:center;max-width:500px;">
        <div style="font-size:80px;font-weight:800;background:linear-gradient(135deg,#ef4444,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;" th:text="${errorCode}">500</div>
        <h2 style="font-size:24px;font-weight:700;color:var(--text-primary);margin:16px 0 8px;" th:text="${errorTitle}">Something went wrong</h2>
        <p style="color:var(--text-secondary);margin-bottom:24px;" th:text="${errorMessage}">An error occurred.</p>
        <a href="/dashboard" class="btn-primary-smart"><i class="bi bi-house"></i> Back to Dashboard</a>
      </div>
    </div>
  </main>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
