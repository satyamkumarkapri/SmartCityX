<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Document Form | SmartCityX', 'Create document')}"></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{layout/base :: sidebar('documents')}"></div>
  <main class="main-content">
    <div th:replace="~{layout/base :: header('City Document', 'Create or edit city document')}"></div>
    <div class="page-content" style="max-width:720px;">
      <div class="card-glass">
        <div class="section-header mb-4">
          <div class="section-title"><i class="bi bi-file-earmark-plus"></i>
            <span th:text="${document.id != null} ? 'Edit Document' : 'New Document'">Form</span>
          </div>
          <a href="/documents" class="btn-ghost"><i class="bi bi-arrow-left"></i> Back</a>
        </div>
        <form th:action="${document.id != null} ? '/documents/'+${document.id} : '/documents'" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label-smart">Title *</label>
              <input type="text" name="title" class="form-control-smart" required th:value="${document.title}" placeholder="Document title..."/>
            </div>
            <div class="col-md-6">
              <label class="form-label-smart">Document Type *</label>
              <select name="documentType" class="form-control-smart" required>
                <option th:each="t : ${docTypes}" th:value="${t}" th:text="${t}" th:selected="${document.documentType == t}"></option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label-smart">Department *</label>
              <input type="text" name="department" class="form-control-smart" required th:value="${document.department}" placeholder="e.g. Roads Dept"/>
            </div>
            <div class="col-md-6">
              <label class="form-label-smart">Author</label>
              <input type="text" name="author" class="form-control-smart" th:value="${document.author}" placeholder="Author name"/>
            </div>
            <div class="col-12">
              <label class="form-label-smart">Content</label>
              <textarea name="content" class="form-control-smart" rows="8" placeholder="Document content..." th:text="${document.content}"></textarea>
            </div>
            <div class="col-12 mt-2" style="display:flex;gap:12px;">
              <button type="submit" class="btn-primary-smart"><i class="bi bi-save"></i> Save Document</button>
              <a href="/documents" class="btn-ghost">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
