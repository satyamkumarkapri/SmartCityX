<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title, desc)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" th:content="${desc ?: 'SmartCityX Analytics Platform'}"/>
  <title th:text="${title ?: 'SmartCityX'}">SmartCityX</title>
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Main CSS -->
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<!-- ────────────────────────────────────────────────────────────
     SIDEBAR FRAGMENT
──────────────────────────────────────────────────────────── -->
<aside th:fragment="sidebar(activePage)" class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <a href="/dashboard" class="brand-logo">
      <div class="brand-icon"><i class="bi bi-buildings-fill"></i></div>
      <div class="brand-text">
        <h1>SmartCityX</h1>
      </div>
    </a>
  </div>

  <nav class="sidebar-nav">
    <a href="/dashboard" class="nav-item" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
      <i class="bi bi-house-door"></i> Dashboard
    </a>
    <a href="/transportation" class="nav-item" th:classappend="${activePage == 'transportation'} ? 'active' : ''">
      <i class="bi bi-car-front"></i> Transportation
    </a>
    <a href="/water-energy" class="nav-item" th:classappend="${activePage == 'water-energy'} ? 'active' : ''">
      <i class="bi bi-droplet"></i> Water & Energy
    </a>
    <a href="/requests" class="nav-item" th:classappend="${activePage == 'requests'} ? 'active' : ''">
      <i class="bi bi-people"></i> Public Services
    </a>
    <a href="/infrastructure" class="nav-item" th:classappend="${activePage == 'infrastructure'} ? 'active' : ''">
      <i class="bi bi-building"></i> Infrastructure
    </a>
    <a href="/sensors" class="nav-item" th:classappend="${activePage == 'sensors'} ? 'active' : ''">
      <i class="bi bi-broadcast"></i> IoT & Sensors
    </a>
    <a href="/analytics" class="nav-item" th:classappend="${activePage == 'analytics'} ? 'active' : ''">
      <i class="bi bi-bar-chart"></i> Analytics
    </a>
    <a href="/reports" class="nav-item" th:classappend="${activePage == 'reports'} ? 'active' : ''">
      <i class="bi bi-file-earmark-text"></i> Reports
    </a>
    <a href="/documents" class="nav-item" th:classappend="${activePage == 'documents'} ? 'active' : ''">
      <i class="bi bi-folder2-open"></i> Documents
    </a>
    <a href="/notifications" class="nav-item" th:classappend="${activePage == 'notifications'} ? 'active' : ''">
      <i class="bi bi-bell"></i> Notifications <span class="badge-count">3</span>
    </a>
    <a href="/settings" class="nav-item" th:classappend="${activePage == 'settings'} ? 'active' : ''">
      <i class="bi bi-gear"></i> Settings
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="/logout" class="nav-item">
      <i class="bi bi-box-arrow-right"></i> Logout
    </a>
  </div>
</aside>

<!-- ────────────────────────────────────────────────────────────
     TOP HEADER FRAGMENT
──────────────────────────────────────────────────────────── -->
<header th:fragment="header(title, subtitle)" class="top-header">
  <div class="page-title">
    <h2 th:text="${title}">Dashboard</h2>
    <p th:text="${subtitle}">Overview</p>
  </div>
  
  <div class="header-actions">
    <div class="header-search d-none d-md-block me-3">
      <i class="bi bi-search"></i>
      <input type="text" placeholder="Search data..."/>
    </div>
    <i class="bi bi-bell header-icon active"></i>
    <div class="user-profile ms-3">
      <div class="user-avatar">SK</div>
      <div class="user-info-text">
        <span class="name">Satyam Kumar</span>
        <span class="role">Citizen</span>
      </div>
    </div>
  </div>
</header>

<!-- ────────────────────────────────────────────────────────────
     SCRIPTS FRAGMENT
──────────────────────────────────────────────────────────── -->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/main.js}"></script>
</th:block>

</body>
</html>
